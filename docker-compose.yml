version: '3.8'

services:
  front:
    build:
      context: ./front-react
    container_name: votacao-front
    ports:
      - "5173:5173"
    volumes:
      - ./front-react:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8080/api/v1
    depends_on:
      - api
    restart: always

  api:
    build:
      context: ./back-java
    container_name: votacao-api
    ports:
      - "${SERVER_PORT:-8080}:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://${DB_HOST:-postgres}:${DB_PORT:-5432}/${DB_NAME:-votacao_db}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-votacao_user}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-votacao_password}
      SPRING_RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-guest}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASS:-guest}
      SPRING_DATA_REDIS_HOST: ${REDIS_HOST:-redis}
      SPRING_DATA_REDIS_PORT: ${REDIS_PORT:-6379}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: "true"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_started
      redis:
        condition: service_started
    restart: always

  postgres:
    image: postgres:15-alpine
    container_name: votacao-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-votacao_db}
      POSTGRES_USER: ${DB_USER:-votacao_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-votacao_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-votacao_user} -d ${DB_NAME:-votacao_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: votacao-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-guest}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: votacao-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/var/lib/redis
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
